services:
  # Backend API + Socket.IO
  - type: web
    name: callbreak-game-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://callbreak-game-uzq8.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: callbreak-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: callbreak-game
    runtime: static
    buildCommand: npm install --include=dev && npm run build:client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://callbreak-game-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: callbreak-db
    plan: free
    databaseName: callbreak
    user: callbreak_user
